name: dock77-keycap-tryon

services:
  web:
    build: .
    restart: unless-stopped
    # OPENAI_API_KEY (and optionally OPENAI_BASE_URL) go in a .env file next to this one.
    env_file: .env
    environment:
      PORT: 31430
    # The app listens on port 31430, exposed on the same port on the host.
    ports:
      - "31430:31430"
